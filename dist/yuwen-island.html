<!doctype html>
<html lang="zh-CN">
<head>
  <!-- 语文岛单文件离线版，由 scripts/bundle.js 生成于 2026-11-03，请勿直接修改，改源文件后重新打包 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6efe1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="语文岛">
  <title>语文岛 · 四年级上册</title>
  <style>
/* 语文岛 · 样式
 * 温润纸张底色 + 朱砂印章 + 水墨点缀。颜色全部用 CSS 变量，跟随系统浅色/深色。
 * 移动优先：375px 基准，可点区域 ≥ 48px，正文 ≥ 18px，古诗 ≥ 22px。 */

:root {
  --paper: #f6efe1;
  --paper-2: #efe5d0;
  --card: #fffaf0;
  --ink: #2b2723;
  --ink-2: #5c554b;
  --ink-3: #8a8174;
  --line: #e3d7bf;
  --seal: #b8432f;
  --seal-ink: #fff6ee;
  --jade: #2f7d68;
  --jade-bg: #e3f1ea;
  --amber: #b9771c;
  --amber-bg: #fbf0d9;
  --rose-bg: #fbe8e1;
  --good: #2f7d68;
  --shadow: 0 1px 0 rgba(80, 60, 30, .06), 0 6px 18px -8px rgba(80, 60, 30, .25);
  --radius: 18px;
  --theme: var(--seal);
  --tint-a: .12;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-poem: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  --fs: 18px;
  --fs-poem: 24px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --nav-h: 64px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1c1a17;
    --paper-2: #24211d;
    --card: #2a2622;
    --ink: #efe8db;
    --ink-2: #c9bfae;
    --ink-3: #9a907f;
    --line: #3d3730;
    --seal: #e0664e;
    --seal-ink: #2a1610;
    --jade: #6cc4a6;
    --jade-bg: #1f3a31;
    --amber: #e6a94a;
    --amber-bg: #3a2e19;
    --rose-bg: #3d2420;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
    --tint-a: .22;
    color-scheme: dark;
  }
}

html[data-font="large"] { --fs: 21px; --fs-poem: 28px; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(184, 67, 47, .05) 0 60px, transparent 61px),
    radial-gradient(circle at 92% 30%, rgba(47, 125, 104, .05) 0 90px, transparent 91px),
    linear-gradient(var(--paper), var(--paper-2));
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
.hidden { display: none !important; }
.poem-font { font-family: var(--font-poem); }

:focus-visible { outline: 3px solid var(--theme); outline-offset: 2px; border-radius: 10px; }

/* ---------- 页面外壳 ---------- */
.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 calc(16px + var(--safe-r)) calc(24px + var(--safe-b)) calc(16px + var(--safe-l));
}
.app.has-nav { padding-bottom: calc(var(--nav-h) + 24px + var(--safe-b)); }
.page-body { padding-top: 8px; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  margin: 0 calc(-16px - var(--safe-r)) 8px calc(-16px - var(--safe-l));
  padding: calc(6px + var(--safe-t)) calc(8px + var(--safe-r)) 6px calc(8px + var(--safe-l));
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
@supports (backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px)) {
  .topbar { background: rgba(246, 239, 225, .82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  @media (prefers-color-scheme: dark) { .topbar { background: rgba(28, 26, 23, .82); } }
}
.back, .back-space { flex: 0 0 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; }
.back { color: var(--theme); }
.back:active { background: var(--line); }
.topbar-title { flex: 1; text-align: center; font-size: 19px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title .ico { margin-right: 6px; }
.svg-ico { display: inline-grid; place-items: center; }

/* 底部导航 */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  padding: 4px calc(4px + var(--safe-r)) calc(4px + var(--safe-b)) calc(4px + var(--safe-l));
  background: var(--card);
  border-top: 1px solid var(--line);
  box-shadow: 0 -6px 18px -12px rgba(0, 0, 0, .3);
}
.nav-item {
  flex: 1 1 0; max-width: 112px; min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 14px; color: var(--ink-3); font-size: 12px; line-height: 1.2;
}
.nav-ico { font-size: 22px; line-height: 1.2; filter: grayscale(.6); opacity: .8; }
.nav-item.on { color: var(--seal); font-weight: 700; }
.nav-item.on .nav-ico { filter: none; opacity: 1; }

/* ---------- 通用组件 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 10px 20px;
  border: 1.5px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--ink);
  font-size: 17px; font-weight: 600; text-align: center;
  transition: transform .12s ease, background-color .2s;
  touch-action: manipulation;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn.primary { background: var(--theme); border-color: var(--theme); color: #fff; }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.soft { background: var(--amber-bg); border-color: transparent; color: var(--ink); }
.btn.small { min-height: 48px; padding: 8px 16px; font-size: 15px; }
.btn.wide { width: 100%; }

.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin: 14px 0;
}
.card-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
.card-text { color: var(--ink-2); }
.card-text.small, small { font-size: 14px; }
.tip { font-size: 15px; color: var(--ink-3); margin: 6px 0 10px; }
.tip.center, .center { text-align: center; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }

.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--rose-bg); color: var(--seal); font-weight: 600; }
.chip.soft { background: var(--paper-2); color: var(--ink-2); font-weight: 500; }
.chip.bonus { background: var(--amber-bg); color: var(--amber); }
.chip.test { background: var(--theme); color: #fff; }

.stars { display: inline-flex; gap: 1px; color: var(--ink-3); font-size: 16px; line-height: 1; }
.stars .star:not(.on) { opacity: .55; }
.stars .star.on { color: #e0a321; }
.stars.big { font-size: 34px; gap: 4px; }

.pbar { display: block; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.pbar-fill { display: block; height: 100%; background: var(--theme); border-radius: 6px; transition: width .3s ease; }

.sec-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; margin: 22px 2px 10px; letter-spacing: .06em; }
.sec-dot { width: 10px; height: 10px; border-radius: 50% 40% 55% 45%; background: var(--ink); opacity: .75; }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: calc(100vw - 48px);
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 16px;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.modal-wrap {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: 24px calc(20px + var(--safe-r)) calc(24px + var(--safe-b)) calc(20px + var(--safe-l));
  background: rgba(30, 24, 18, .45);
  animation: fade .2s ease;
}
.modal {
  width: 100%; max-width: 380px; background: var(--card); border-radius: 22px; padding: 24px 20px 18px;
  text-align: center; box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .5);
  animation: pop .25s ease;
}
.modal-icon { font-size: 44px; line-height: 1.2; }
.modal-title { font-size: 20px; margin: 6px 0 8px; }
.modal-text { color: var(--ink-2); }
.modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }

/* 印章式庆祝 */
.stamp-pop {
  position: absolute; right: 14px; top: 10px; z-index: 5;
  width: 64px; height: 64px; display: grid; place-items: center;
  border: 3px solid var(--seal); border-radius: 12px; color: var(--seal);
  font-family: var(--font-poem); font-size: 34px; font-weight: 900;
  transform: rotate(-12deg); pointer-events: none;
  animation: stamp .28s cubic-bezier(.2, 1.4, .5, 1) both, fadeout .4s ease .5s forwards;
  background: rgba(255, 255, 255, .08);
}
@keyframes stamp { from { transform: scale(1.8) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: .9; } }
@keyframes fadeout { to { opacity: 0; } }

/* ---------- 首页地图 ---------- */
.home-page .page-body { padding-top: calc(12px + var(--safe-t)); }
.home-hero { display: flex; align-items: center; gap: 14px; padding: 12px 4px 4px; }
.hero-seal {
  flex: 0 0 auto; width: 72px; height: 72px; border-radius: 14px;
  background: var(--seal); color: var(--seal-ink);
  display: grid; grid-template-columns: 1fr; place-items: center; align-content: center;
  font-family: var(--font-poem); font-weight: 900; font-size: 22px; line-height: 1.05;
  transform: rotate(-4deg); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .25), var(--shadow);
}
.hero-seal span:last-child { font-size: 30px; }
.hero-hello { font-size: 15px; color: var(--ink-3); }
.hero-title { font-size: 24px; font-weight: 800; letter-spacing: .04em; line-height: 1.3; }
.hero-sub { font-size: 16px; color: var(--ink-2); }

.island-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.island {
  position: relative; isolation: isolate;
  display: flex; flex-direction: column; gap: 4px;
  min-height: 148px; padding: 14px 14px 12px;
  background: var(--card); box-shadow: var(--shadow);
  border-radius: 26px 22px 28px 20px;
  overflow: hidden;
  transition: transform .15s ease;
  --theme: var(--c);
}
.island::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(120% 90% at 100% 0%, var(--c) 0 34%, transparent 35%), var(--c);
  opacity: var(--tint-a);
}
.island.shape1 { border-radius: 22px 28px 20px 26px; }
.island.shape2 { border-radius: 28px 20px 24px 28px; }
.island.shape3 { border-radius: 20px 26px 28px 22px; }
.island:active { transform: scale(.97); }
.island-ico { font-size: 34px; line-height: 1.1; }
.island-no { font-size: 13px; color: var(--c); font-weight: 700; letter-spacing: .08em; filter: brightness(.9); }
.island-name { font-size: 18px; font-weight: 800; line-height: 1.3; }
.island-desc { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.island-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.island-pct { font-size: 13px; color: var(--ink-3); }
.island .pbar { height: 5px; }
.island .pbar-fill { background: var(--c); }
@media (prefers-color-scheme: dark) { .island-no { filter: brightness(1.4); } }
.home-foot { text-align: center; font-size: 13px; color: var(--ink-3); margin: 28px 0 8px; }

/* ---------- 背诵馆 ---------- */
.hall-hero {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px; margin: 6px 0 14px; border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow);
  border-left: 6px solid var(--theme);
}
.hall-lead { font-family: var(--font-poem); font-size: 22px; font-weight: 700; }
.hall-sub { font-size: 15px; color: var(--ink-2); }
.hall-hero-stat { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.hall-hero-stat .stars.big { font-size: 26px; }

.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.action {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-height: 84px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow);
}
.action.big { grid-column: 1 / -1; background: var(--theme); color: #fff; }
.action.big small { color: rgba(255, 255, 255, .85); }
.action-ico { font-size: 26px; line-height: 1.2; }
.action b { font-size: 18px; }
.action small { color: var(--ink-3); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

.poem-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.poem-card {
  position: relative; display: flex; flex-direction: column; gap: 2px;
  min-height: 132px; padding: 14px 14px 12px; border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow); overflow: hidden;
}
.poem-card::after {
  content: ""; position: absolute; right: -18px; bottom: -22px; width: 70px; height: 70px; border-radius: 50%;
  background: radial-gradient(circle, var(--ink) 0 30%, transparent 70%); opacity: .05;
}
.poem-card-title { font-size: 21px; font-weight: 700; line-height: 1.3; }
.poem-card-by { font-size: 13px; color: var(--ink-3); }
.poem-card-first { font-size: 15px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recite-seals { display: inline-flex; gap: 4px; margin-top: auto; padding-top: 6px; }
.rseal {
  width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 6px;
  border: 1.5px solid var(--line); color: var(--ink-3); font-family: var(--font-poem); font-size: 12px; font-weight: 700;
}
.rseal.on { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); transform: rotate(-6deg); }

/* 诗文纸页 */
.poem-sheet {
  position: relative; text-align: center;
  padding: 26px 16px 22px; margin: 6px 0 14px;
  background: var(--card); border-radius: 6px 6px var(--radius) var(--radius);
  box-shadow: var(--shadow);
  background-image: repeating-linear-gradient(90deg, transparent 0 47px, rgba(184, 67, 47, .06) 47px 48px);
  overflow: hidden;
}
.poem-sheet::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--theme); opacity: .85;
}
.ink-dot {
  position: absolute; left: -26px; bottom: -30px; width: 110px; height: 110px; border-radius: 48% 52% 45% 55%;
  background: radial-gradient(circle at 40% 40%, var(--ink) 0 18%, transparent 62%); opacity: .07; pointer-events: none;
}
.poem-title { font-size: calc(var(--fs-poem) + 4px); font-weight: 800; letter-spacing: .2em; }
.poem-by { color: var(--ink-3); font-size: 15px; margin: 2px 0 14px; }
.poem-text { font-family: var(--font-poem); font-size: var(--fs-poem); line-height: 2.1; letter-spacing: .12em; }
.poem-line { border-radius: 8px; transition: background-color .2s, color .2s; padding: 0 4px; }
.poem-line.reading { background: var(--amber-bg); color: var(--seal); }
.poem-text.prose { text-align: left; letter-spacing: .06em; line-height: 2; }
.poem-text.prose .poem-line { display: inline; padding: 2px 0; }
.read-btn { margin-top: 14px; color: var(--theme); border-color: var(--theme); }
.read-btn[aria-pressed="true"] { background: var(--theme); color: #fff; }

.note-list { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 12px; background: var(--paper); border-radius: 12px; }
.note b { font-size: 20px; color: var(--seal); }
.note-py { font-size: 15px; color: var(--jade); font-weight: 600; }
.point + .point { margin-top: 12px; }
.done-note { text-align: center; color: var(--jade); font-weight: 700; margin: 6px 0 16px; }

/* 遮字背诵 */
.level-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 10px; }
.level-tab {
  min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 14px; background: var(--card); box-shadow: var(--shadow); line-height: 1.3;
}
.level-tab small { color: var(--jade); font-size: 12px; min-height: 1em; }
.level-tab.on { background: var(--theme); color: #fff; }
.level-tab.on small { color: rgba(255, 255, 255, .9); }
.level-tip { font-size: 14px; color: var(--ink-3); margin-bottom: 8px; }
.recite .poem-line { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; letter-spacing: 0; }
.recite.prose { display: flex; flex-wrap: wrap; align-items: center; }
.recite.prose .poem-line { display: contents; }
.recite .clause { display: inline-flex; align-items: center; white-space: nowrap; }
.recite.prose .clause { margin-right: 2px; }
.recite .ch { display: inline-block; min-width: 1.15em; text-align: center; }
.recite .ch.punct { min-width: .8em; }
.mask {
  position: relative; display: inline-grid; place-items: center;
  width: 1.2em; height: 1.25em; margin: 2px 1px; padding: 0;
  border: 1.5px dashed var(--ink-3); border-radius: 6px; background: var(--paper);
  font: inherit; line-height: 1; touch-action: manipulation;
}
.mask::before { content: ""; position: absolute; inset: -6px -2px; } /* 放大点按区域 */
.mask .mask-ch { visibility: hidden; color: var(--seal); }
.mask.shown { border-style: solid; border-color: var(--amber); background: var(--amber-bg); }
.mask.shown .mask-ch { visibility: visible; }
.self-eval { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }

/* ---------- 答题 ---------- */
.quiz-head { position: sticky; top: calc(61px + var(--safe-t)); z-index: 10; padding: 6px 0 8px; background: var(--paper); }
.quiz-count { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--ink-2); margin-bottom: 6px; }
.quiz-count b { color: var(--theme); font-size: 18px; }
.q-card { position: relative; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 6px 0 12px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.q-prompt { font-size: calc(var(--fs) + 1px); font-weight: 700; line-height: 1.55; margin-bottom: 12px; }
.q-quote {
  margin: 0 0 14px; padding: 10px 14px; border-left: 4px solid var(--theme); border-radius: 4px 12px 12px 4px;
  background: var(--paper); font-size: calc(var(--fs-poem) - 2px); letter-spacing: .08em;
}

.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.grid { display: grid; grid-template-columns: 1fr 1fr; }
.opt {
  min-height: 52px; padding: 10px 14px; text-align: left;
  border: 2px solid var(--line); border-radius: 14px; background: var(--card);
  font-size: var(--fs); line-height: 1.45; touch-action: manipulation;
  transition: border-color .15s, background-color .15s, transform .12s;
}
.opts.grid .opt { text-align: center; }
.opt:active { transform: scale(.98); }
.opt.sel { border-color: var(--theme); }
.opt.ok { border-color: var(--jade); background: var(--jade-bg); }
.opt.bad { border-color: var(--amber); background: var(--amber-bg); animation: nudge .25s ease; }
.opt.dim { opacity: .5; }
.opt.reveal { box-shadow: 0 0 0 3px var(--jade-bg); }
.opt.multi { display: flex; align-items: center; gap: 10px; }
.tick { flex: 0 0 26px; height: 26px; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; color: transparent; font-weight: 900; }
.opt.multi.sel .tick { background: var(--theme); border-color: var(--theme); color: #fff; }
.opt.judge { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 84px; font-weight: 700; }
.judge-ico { font-size: 30px; line-height: 1; }
@keyframes nudge { 30% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }
.check-btn { width: 100%; margin-top: 14px; }

/* 字块填空 */
.blank-line { font-size: calc(var(--fs) + 2px); line-height: 2.3; text-align: center; padding: 6px 0 4px; }
.blank-line.poem-font { font-size: var(--fs-poem); letter-spacing: .08em; }
.slot {
  display: inline-grid; place-items: center; vertical-align: middle;
  min-width: 52px; min-height: 48px; margin: 0 3px; padding: 0 8px;
  border: none; border-bottom: 3px solid var(--theme); border-radius: 8px 8px 2px 2px;
  background: var(--paper); font: inherit; color: var(--seal); font-weight: 700;
}
.slot.filled { background: var(--rose-bg); }
.slot.ok { color: var(--jade); border-color: var(--jade); background: var(--jade-bg); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 12px; }
.tile {
  min-width: 56px; min-height: 56px; padding: 6px 12px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
  font-size: calc(var(--fs) + 4px); font-weight: 600; touch-action: manipulation;
}
.tile.used { opacity: .25; box-shadow: none; }

/* 输入 */
.input-q { display: flex; flex-direction: column; gap: 10px; }
.text-input { min-height: 52px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); font-size: var(--fs); }
.text-input:focus { outline: none; border-color: var(--theme); }
.text-input.ok { border-color: var(--jade); background: var(--jade-bg); }

/* 排序 */
.sort-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.sort-card {
  display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 10px 12px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
  font-family: var(--font-poem); font-size: calc(var(--fs) + 2px); counter-increment: s; user-select: none; -webkit-user-select: none;
}
.sort-card::before { content: counter(s); flex: 0 0 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--paper-2); color: var(--ink-3); font-family: var(--font); font-size: 14px; font-weight: 700; }
.sort-list.plain .sort-card::before { display: none; }
.sort-grip { order: 3; margin-left: auto; color: var(--ink-3); letter-spacing: -2px; font-family: var(--font); }
.sort-card.sel { border-color: var(--theme); background: var(--rose-bg); }
.sort-card.ok { border-color: var(--jade); }
.sort-card.drag-src { opacity: .35; }
.locked .sort-card, .locked .col-card { cursor: default; }

.draggable { touch-action: none; cursor: grab; }
.locked .draggable { touch-action: auto; }
.drag-ghost {
  position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; margin: 0;
  box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .45); opacity: .95; list-style: none;
}

/* 连线 */
.match-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match-col { display: flex; flex-direction: column; gap: 8px; }
.match-title { font-size: 13px; color: var(--ink-3); text-align: center; }
.match-item {
  min-height: 52px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--card);
  font-size: calc(var(--fs) - 1px); line-height: 1.35; touch-action: manipulation;
}
.match-item.sel { border-color: var(--theme); background: var(--rose-bg); box-shadow: 0 0 0 3px var(--rose-bg); }
.match-item.paired { border-style: solid; }
.match-item.c0 { border-color: #c2412d; background: rgba(194, 65, 45, var(--tint-a)); }
.match-item.c1 { border-color: #2f7d68; background: rgba(47, 125, 104, var(--tint-a)); }
.match-item.c2 { border-color: #2f6fa3; background: rgba(47, 111, 163, var(--tint-a)); }
.match-item.c3 { border-color: #b9771c; background: rgba(185, 119, 28, var(--tint-a)); }
.match-item.c4 { border-color: #7a5aa6; background: rgba(122, 90, 166, var(--tint-a)); }
.match-item.c5 { border-color: #8a6d3b; background: rgba(138, 109, 59, var(--tint-a)); }

/* 分栏 */
.col-tip { font-size: 15px; color: var(--ink-3); margin-bottom: 8px; }
.col-pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; padding: 8px; border: 2px dashed var(--line); border-radius: 14px; }
.col-pool.empty::after { content: "都放好啦"; color: var(--ink-3); font-size: 14px; margin: auto; }
.col-buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }
.col-bucket { min-height: 120px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); padding: 6px; transition: border-color .15s, background-color .15s; }
.col-buckets.picking .col-bucket { border-style: dashed; border-color: var(--theme); }
.col-bucket.over { border-color: var(--theme); background: var(--rose-bg); }
.col-head { text-align: center; font-weight: 700; font-size: 16px; padding: 4px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.col-drop { display: flex; flex-direction: column; gap: 6px; }
.col-card {
  min-height: 48px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow);
  font-size: calc(var(--fs) - 1px); user-select: none; -webkit-user-select: none;
}
.col-card.sel { border-color: var(--theme); background: var(--rose-bg); }
.col-card.ok { border-color: var(--jade); }
.col-card.drag-src { opacity: .35; }

/* 断句 */
.seg-row {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; row-gap: 6px;
  font-family: var(--font-poem); font-size: var(--fs-poem); padding: 8px 0;
}
.seg-char { display: inline-block; padding: 0 1px; }
.seg-gap {
  position: relative; width: 22px; height: 48px; padding: 0; margin: 0 -1px;
  border: none; background: transparent; touch-action: manipulation;
}
.seg-gap::before { content: ""; position: absolute; left: 50%; top: 12px; bottom: 12px; width: 2px; margin-left: -1px; background: var(--line); border-radius: 2px; }
.seg-gap .seg-slash { position: relative; color: transparent; font-weight: 900; font-family: var(--font); font-size: 24px; }
.seg-gap.on::before { display: none; }
.seg-gap.on .seg-slash { color: var(--seal); }
.seg-gap.ok .seg-slash { color: var(--jade); }
.seg-gap.bad .seg-slash { color: var(--amber); }
.seg-gap.bad:not(.on)::before { display: none; }
.seg-gap.bad:not(.on) .seg-slash { color: var(--amber); opacity: .6; }

/* 自查卡 */
.selfcheck-q { display: flex; flex-direction: column; gap: 12px; }
.flip-card { position: relative; min-height: 140px; border-radius: 16px; background: var(--paper); border: 2px dashed var(--line); display: grid; place-items: center; padding: 16px; text-align: center; }
.flip-front { color: var(--ink-2); }
.flip-ico { font-size: 34px; }
.flip-back { display: none; font-size: var(--fs-poem); line-height: 1.9; letter-spacing: .08em; }
.flip-card.flipped { border-style: solid; border-color: var(--jade); background: var(--jade-bg); }
.flip-card.flipped .flip-front { display: none; }
.flip-card.flipped .flip-back { display: block; }
.self-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* 反馈 */
.feedback { border-radius: var(--radius); padding: 0; margin: 0 0 12px; }
.feedback:empty { display: none; }
.feedback.good, .feedback.hint, .feedback.explain { padding: 14px 16px; animation: pop .2s ease; }
.feedback.good { background: var(--jade-bg); }
.feedback.hint { background: var(--amber-bg); }
.feedback.explain { background: var(--card); box-shadow: var(--shadow); border-left: 5px solid var(--amber); }
.fb-title { font-weight: 700; margin-bottom: 4px; }
.fb-text { color: var(--ink-2); }
.fb-text.soft { color: var(--ink-3); font-size: 15px; margin-top: 6px; }
.next-bar { padding: 4px 0 12px; }
.next-bar .btn { box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .45); }

/* 总结 */
.summary { text-align: center; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 16px; margin-top: 12px; }
.sum-seal {
  width: 72px; height: 72px; margin: 0 auto 8px; display: grid; place-items: center; border-radius: 16px;
  background: var(--seal); color: var(--seal-ink); font-family: var(--font-poem); font-size: 38px; font-weight: 900; transform: rotate(-6deg);
}
.sum-stars { margin-bottom: 6px; }
.sum-title { font-size: 22px; }
.sum-sub { color: var(--ink-2); margin-top: 6px; }
.sum-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
.sum-num { background: var(--paper); border-radius: 14px; padding: 10px 4px; display: flex; flex-direction: column; }
.sum-num b { font-size: 24px; color: var(--theme); }
.sum-num span { font-size: 13px; color: var(--ink-3); }
.sum-weak { text-align: left; background: var(--amber-bg); border-radius: 14px; padding: 12px 16px; }
.sum-weak ul { margin: 6px 0 0; padding-left: 1.2em; }
.sum-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.empty-card { text-align: center; padding: 40px 16px; }

/* ---------- 设置与家长页 ---------- */
.settings { padding: 4px 16px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 8px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-text { display: flex; flex-direction: column; }
.set-text small { color: var(--ink-3); }
.chev { font-size: 28px; color: var(--ink-3); }
.switch { flex: 0 0 auto; position: relative; width: 60px; height: 36px; border-radius: 999px; border: none; background: var(--line); padding: 0; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; inset: -6px; } /* 点按区域 ≥ 48px */
.switch-knob { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch.on { background: var(--good); }
.switch.on .switch-knob { transform: translateX(24px); }
.switch:disabled { opacity: .4; }
.seg-ctl { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 3px; }
.seg-opt { min-width: 64px; min-height: 44px; border: none; border-radius: 999px; background: transparent; font-weight: 600; }
.seg-opt.on { background: var(--card); box-shadow: var(--shadow); color: var(--seal); }
.ptable { width: 100%; border-collapse: collapse; font-size: 15px; }
.ptable th, .ptable td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: center; }
.ptable td:first-child, .ptable th:first-child { text-align: left; }
.check-list { margin: 10px 0 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.check-list small { display: block; color: var(--ink-3); }
.check-list code { display: block; font-size: 12px; color: var(--ink-3); word-break: break-all; }
.building { text-align: center; padding: 28px 18px; }
.building-ico { font-size: 44px; }
.building h2 { margin: 6px 0 8px; }
.building .btn.primary { margin-top: 14px; }

/* ---------- 减少动态效果 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .stamp-pop { display: none; }
}

/* ---------- 单元岛 ---------- */
.unit-hero {
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px; margin: 6px 0 10px; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow);
}
.unit-hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--c); opacity: var(--tint-a); }
.unit-no { display: inline-block; font-family: var(--font-poem); font-weight: 800; font-size: 20px; color: var(--c); }
@media (prefers-color-scheme: dark) { .unit-no { filter: brightness(1.5); } }
.unit-lessons { font-size: 15px; color: var(--ink-2); line-height: 1.5; margin-top: 2px; }
.unit-hero-stat { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.unit-hero-stat .stars.big { font-size: 24px; }
.element-note { font-size: 15px; color: var(--ink-2); padding: 0 4px 6px; }
.element-note b { color: var(--theme); }
@media (prefers-color-scheme: dark) { .element-note b { filter: brightness(1.5); } }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; margin: 8px 0 12px; background: var(--paper-2); border-radius: 16px; }
.tab { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; font-weight: 700; font-size: 16px; color: var(--ink-2); }
.tab.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.kdeck { display: flex; flex-direction: column; gap: 10px; }
.kcard {
  position: relative; min-height: 300px; padding: 18px 16px; border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow); touch-action: pan-y; overflow: hidden;
  border-top: 5px solid var(--theme);
}
.kcard.slide-left { animation: slideL .25s ease; }
.kcard.slide-right { animation: slideR .25s ease; }
@keyframes slideL { from { transform: translateX(24px); opacity: .3; } }
@keyframes slideR { from { transform: translateX(-24px); opacity: .3; } }
.kcard-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.kcard-by { font-size: 14px; color: var(--ink-3); }
.kcard-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.kcard-points { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.kcard-points li::marker { color: var(--theme); }
.kcard-tips { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: var(--amber-bg); font-size: 16px; display: flex; flex-direction: column; gap: 6px; }
.kcard-table { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 15px; }
.kcard-table th, .kcard-table td { border: 1px solid var(--line); padding: 6px 4px; text-align: center; }
.kcard-table th { background: var(--paper); font-weight: 600; }
.todo { color: var(--ink-3); font-size: 13px; }
.row-btns.left { justify-content: flex-start; }
.knav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kcount { font-size: 15px; color: var(--ink-3); }
.kdots { display: flex; justify-content: center; flex-wrap: wrap; gap: 0; }
.kdot { width: 28px; height: 28px; border: none; background: transparent; padding: 0; position: relative; }
.kdot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--line); }
.kdot.known::after { background: var(--good); }
.kdot.on::after { background: var(--theme); transform: scale(1.35); }
.know-btn { width: 100%; border-color: var(--good); color: var(--good); }
.know-btn.on { background: var(--good); color: #fff; }

.start-card { text-align: center; padding: 22px 16px; }
.start-ico { font-size: 40px; }
.start-card h2 { margin: 4px 0 6px; }
.start-card .btn { margin-top: 14px; }
.start-best { display: flex; flex-direction: column; align-items: center; margin-top: 10px; color: var(--ink-3); }
.feature-list { display: flex; flex-direction: column; gap: 10px; }
.feature { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px 14px; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
.feature-ico { font-size: 28px; flex: 0 0 auto; }
.feature-text { flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
.feature-text small { color: var(--ink-3); }

/* 起因经过结果 */
.story-step + .story-step { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.step-label { font-size: 15px; color: var(--ink-2); margin-bottom: 8px; }
.step-label b { color: var(--theme); }
.story-recap { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.recap-row { display: flex; gap: 8px; align-items: baseline; font-size: 16px; }
.recap-col { flex: 0 0 auto; padding: 1px 8px; border-radius: 8px; background: var(--paper-2); font-weight: 700; font-size: 14px; }
.recap-text { color: var(--ink-2); }
.columns-q .col-card, .story3-q .col-card { text-align: left; line-height: 1.4; }

/* 田忌赛马 */
.tj-head, .tj-grid { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 8px; }
.tj-head { font-size: 14px; color: var(--ink-3); text-align: center; margin-bottom: 6px; }
.tj-rounds, .tj-king { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tj-round { min-height: 56px; display: grid; place-items: center; font-size: 14px; color: var(--ink-3); font-weight: 700; }
.tj-horse { min-height: 56px; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: var(--paper-2); font-size: 16px; }
.tj-list .sort-card { font-family: var(--font); font-size: 16px; padding: 8px 10px; }
.tj-list .sort-card .sort-text::before { content: "🐎 "; }
.tj-ico { font-size: 18px; }
.tj-result { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.tj-result:empty { display: none; }
.tj-race { padding: 10px 12px; border-radius: 14px; background: var(--paper); border-left: 4px solid var(--line); }
.tj-race.win { border-left-color: var(--good); }
.tj-race.lose { border-left-color: var(--amber); }
.tj-race-title { font-size: 15px; margin-bottom: 4px; }
.tj-race.win .tj-race-title b { color: var(--jade); }
.tj-race.lose .tj-race-title b { color: var(--amber); }
.tj-lane { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); min-height: 26px; }
.tj-track { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.tj-bar { display: block; height: 100%; border-radius: 6px; transition: width .3s ease; }
.tj-bar.king { background: var(--ink-3); }
.tj-bar.tian { background: var(--theme); }
.tj-score { text-align: center; font-size: 17px; }
.tj-score b { color: var(--theme); font-size: 20px; }
.col-buckets.stack { grid-template-columns: 1fr; }
.col-buckets.stack .col-bucket { min-height: 76px; display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: start; }
.col-buckets.stack .col-head { border-bottom: none; border-right: 1px solid var(--line); margin: 0; padding: 10px 0; height: 100%; display: grid; place-items: center; }
.col-buckets.stack .col-drop { min-height: 56px; padding: 2px 0; }
.col-pool .col-card { max-width: 100%; text-align: left; }

/* 六要素点选、批注 */
.tag-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.tag-chip {
  min-height: 48px; min-width: 64px; padding: 6px 14px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px; touch-action: manipulation;
}
.tag-chip.on { border-color: var(--theme); background: var(--theme); color: #fff; }
.tag-chip.used:not(.on) { border-style: dashed; color: var(--ink-3); }
.tag-chip.ok { border-color: var(--jade); background: var(--jade-bg); color: var(--ink); }
.tag-passage, .ann-passage { line-height: 1.9; padding: 12px; border-radius: 14px; background: var(--paper); }
.tag-seg, .ann-sent {
  display: inline; padding: 4px 2px; margin: 0; border: none; background: transparent; font: inherit; text-align: left;
  border-bottom: 2px dashed var(--line); border-radius: 4px; touch-action: manipulation;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.tag-seg.tagged { background: var(--rose-bg); border-bottom-color: var(--theme); }
.tag-seg.ok { background: var(--jade-bg); border-bottom-color: var(--jade); }
.tag-seg.bad { background: var(--amber-bg); border-bottom-color: var(--amber); }
.tag-badge {
  display: inline-block; margin-right: 3px; padding: 0 6px; border-radius: 6px; vertical-align: 1px;
  background: var(--theme); color: #fff; font-size: 13px; font-weight: 700; line-height: 1.6;
}
.tag-seg.ok .tag-badge { background: var(--good); }
.tag-seg.bad .tag-badge { background: var(--amber); }
.ann-sent { display: inline; }
.ann-sent.sel { background: var(--rose-bg); border-bottom: 2px solid var(--theme); }
.ann-sent.ok { background: var(--jade-bg); border-bottom-color: var(--jade); }
.ann-sent.bad { opacity: .55; }
.ann-note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 12px; border-radius: 12px; background: var(--amber-bg); border-left: 4px solid var(--amber); }
.ann-note-label { flex: 0 0 auto; font-weight: 700; font-size: 15px; color: var(--amber); }
.ann-note-text { font-family: var(--font-poem); }
.annotate-q .step-label { margin-top: 12px; }

/* 书信格式拼图 */
.letter-pool { margin-bottom: 12px; }

  border: 1px solid var(--line);
}
.letter-slot {
  position: relative; display: flex; align-items: center; min-height: 56px; padding: 4px;
  border: 2px dashed var(--line); border-radius: 10px; background: rgba(255, 255, 255, .04);

/* 语文岛 · 全局命名空间与小工具
 * 所有脚本都用普通 <script> 顺序加载，挂在 window.YuwenIsland 下。
 * 本文件不碰 DOM，测试里也能直接加载。 */
(function (global) {
  'use strict';

  var Y = global.YuwenIsland = global.YuwenIsland || {};
  Y.version = '1.0.0';
  Y.data = Y.data || {};

  var FULL = { ',': '，', '.': '。', '?': '？', '!': '！', ':': '：', ';': '；', '(': '（', ')': '）' };

  Y.util = {
    /** 洗牌，返回新数组 */
    shuffle: function (arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },

    /** 洗牌，并尽量避免和原顺序完全相同（排序题用） */
    shuffleDifferent: function (arr) {
      if (arr.length < 2) return arr.slice();
      for (var k = 0; k < 10; k++) {
        var s = Y.util.shuffle(arr);
        if (s.some(function (v, i) { return v !== arr[i]; })) return s;

    normalize: function (s) {

      s = s.replace(/[,.?!:;()]/g, function (c) { return FULL[c]; });
      s = s.replace(/["“”]/g, '"').replace(/['‘’]/g, "'");
      s = s.replace(/\s+/g, '');
      return s;

    /** 只保留汉字（比对断句、遮字用） */
    hanOnly: function (s) { return String(s).replace(/[^一-鿿]/g, ''); },

    isPunct: function (ch) { return /[，。？！：；、“”‘’（）《》…—,.?!:;"']/.test(ch); },

  <script>/* js/core/store.js */
/* 本地存储与学习进度。键名统一前缀 yw4a:，所有读写都 try/catch；
 * localStorage 不可用时退回内存，照样能做题（只是关掉页面就不记得了）。 */
(function (Y) {
  'use strict';

  var PREFIX = 'yw4a:';
  var memory = {};
  var ls = null;
  try {
    ls = window.localStorage;
    ls.setItem(PREFIX + '__t', '1');
    ls.removeItem(PREFIX + '__t');
  } catch (e) { ls = null; }

  var store = Y.store = {
    available: !!ls,
    get: function (key, def) {
      try {
        var raw = ls ? ls.getItem(PREFIX + key) : memory[key];
        if (raw == null) return def;
        return JSON.parse(raw);
      } catch (e) { return def; }
    },
    set: function (key, val) {
      var raw = JSON.stringify(val);
      try {
        if (ls) ls.setItem(PREFIX + key, raw); else memory[key] = raw;
      } catch (e) { memory[key] = raw; }
    },
    remove: function (key) {
      try { if (ls) ls.removeItem(PREFIX + key); } catch (e) { /* 忽略 */ }
      delete memory[key];
    },
    /** 列出本应用的全部键（不含前缀） */
    keys: function () {
      var out = [];
      try {
        if (ls) {
          for (var i = 0; i < ls.length; i++) {
            var k = ls.key(i);
            if (k && k.indexOf(PREFIX) === 0) out.push(k.slice(PREFIX.length));
          }
        }
      } catch (e) { /* 忽略 */ }
      Object.keys(memory).forEach(function (k) { if (out.indexOf(k) < 0) out.push(k); });
      return out;
    },
    clearAll: function () { store.keys().forEach(store.remove); }
  };

  /* ---------- 设置 ---------- */
  var DEFAULT_SETTINGS = { sound: true, speech: true, fontSize: 'normal' };
  Y.settings = {
    get: function () {
      var s = store.get('settings', {});
      var out = {};
      Object.keys(DEFAULT_SETTINGS).forEach(function (k) { out[k] = k in s ? s[k] : DEFAULT_SETTINGS[k]; });
      return out;
    },
    set: function (k, v) {
      var s = Y.settings.get(); s[k] = v; store.set('settings', s);
      if (Y.applySettings) Y.applySettings();
    }
  };

  /* ---------- 进度 ----------
   * progress = {
   *   q:      { 题目id: { r 答对次数, w 答错次数, streak 错题连续答对, wrong 是否在错题本, t 最近时间 } },
   *   stars:  { 岛id: 最高星数 },
   *   best:   { 岛id: 最高正确率(0~100) },
   *   recite: { 诗id: [第1关, 第2关, 第3关] },
   *   known:  { 知识卡id: true },
   *   days:   ['2026-11-03', ...]
   * } */
  function load() {
    var p = store.get('progress', null) || {};
    p.q = p.q || {}; p.stars = p.stars || {}; p.best = p.best || {};
    p.recite = p.recite || {}; p.known = p.known || {}; p.days = p.days || [];
    return p;
  }

  var P = Y.progress = {
    data: function () { return load(); },
    save: function (p) { store.set('progress', p); },

    /** result: 'first' 一次答对 | 'second' 提示后答对 | 'wrong' 答错 */
    record: function (q, result) {
      var p = load();
      var s = p.q[q.id] || { r: 0, w: 0, streak: 0, wrong: false };
      s.t = Date.now();
      if (result === 'first') {
        s.r++;
        if (s.wrong) {
          s.streak++;
          if (s.streak >= 2) { s.wrong = false; s.streak = 0; s.cleared = true; }
        }
      } else {
        if (result === 'second') s.r++;
        s.w++;
        s.wrong = true;
        s.streak = 0;
      }
      p.q[q.id] = s;
      P.markToday(p);
      P.save(p);
      return s;
    },

    stat: function (id) { return load().q[id] || null; },

    wrongIds: function () {
      var q = load().q;
      return Object.keys(q).filter(function (id) { return q[id].wrong; });
    },

    setStars: function (islandId, stars, percent) {
      var p = load();
      if (!(p.stars[islandId] >= stars)) p.stars[islandId] = stars;
      if (!(p.best[islandId] >= percent)) p.best[islandId] = percent;
      P.save(p);
      return p.stars[islandId];
    },
    stars: function (islandId) { return load().stars[islandId] || 0; },

    recite: function (poemId) { return (load().recite[poemId] || [false, false, false]).slice(); },
    setRecite: function (poemId, level, ok) {
      var p = load();
      var r = p.recite[poemId] || [false, false, false];
      r[level - 1] = !!ok;
      p.recite[poemId] = r;
      P.markToday(p);
      P.save(p);
    },

    isKnown: function (id) { return !!load().known[id]; },
    setKnown: function (id, v) {
      var p = load();
      if (v) p.known[id] = true; else delete p.known[id];
      P.save(p);
    },

    markToday: function (p) {
      var d = Y.util.today();
      if (p.days.indexOf(d) < 0) { p.days.push(d); if (p.days.length > 400) p.days.shift(); }
    }
  };
})(window.YuwenIsland);

(function (Y) {

  function tone(freq, start, dur, type, gain) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    var t0 = c.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    tap: function () { tone(660, 0, 0.08, 'triangle', 0.08); },
    correct: function () { tone(784, 0, 0.16, 'sine'); tone(1046.5, 0.1, 0.26, 'sine'); },

      if (!Y.settings.get().sound) return;
      try { Y.sound.unlock(); if (SOUNDS[name]) SOUNDS[name](); } catch (e) { /* 忽略 */ }
    }
  };
})(window.YuwenIsland);

/* 哈希路由：#/poem/mujiangyin?mode=test
 * 路由表示例：Y.router.add('/poem/:id', function (params, query) {...}) */

    var query = {};

        var p = kv.split('=');

    /** 页面离开时要做的清理（停止朗读、计时器等） */
    onLeave: function (fn) { cleanups.push(fn); },

 * 每种题型的数据格式（q.data / q.answer）：
 *   single   单选  data.options[]          answer: 正确选项文字
 *   multi    多选  data.options[]          answer: [正确选项...]

 *   order    排序                          answer: [正确顺序], acceptable: [[其他可接受顺序]]
 *   match    连线配对 data.leftTitle/rightTitle, data.extra[] 右侧干扰项   answer: [[左, 右], ...]
 *   columns  分栏归类 data.columns[]        answer: { 卡片: 栏名 }
 *   segment  断句   data.text 无标点原文     answer: "王戎七岁/尝与诸小儿游", acceptable: [...]

 *   tagtext  六要素点选 data.segments[] 短文片段, data.labels[]   answer: { 要素: 片段序号 }
 *   annotate 批注 data.sentences[], data.note 批注内容, data.kinds[]   answer: { at: 句子序号, kind: 批注类型, alsoAt?: [] }

/* 渐进遮字背诵：
 *   第 1 关：遮住每句最后 1 个字
 *   第 2 关：遮住每句后一半
 *   第 3 关：全部遮住，只留每句首字提示

        pre += ch;

    if (level === 2) return i >= n - Math.ceil(n / 2);

  Y.maskRecite = function (poem, level) {

    var boxes = [];

    poem.lines.forEach(function (line) {

      clauses(line).forEach(function (c) {

      revealAll: function () { boxes.forEach(function (b) { b.classList.add('shown'); }); },
      hideAll: function () { boxes.forEach(function (b) { b.classList.remove('shown'); }); peeks = 0; },
      peeks: function () { return peeks; },
      count: boxes.length
    };
  };
})(window.YuwenIsland);

/* 题型：起因、经过、结果 → 连成主要内容

(function (Y) {
  'use strict';

  Y.qtypes.story3 = function (q, ctx) {
    var place = q.answer.place;

    var locked = false, step = 1, placedOk = false;
    var nextBtn;
    var cols = Y.columns(frags, q.data.columns, { onChange: function () { nextBtn.disabled = locked || !cols.allPlaced(); } });
    nextBtn = h('button.btn.primary.check-btn', { type: 'button', disabled: true }, '下一步：连成主要内容');

    var step1 = h('div.story-step', h('div.step-label', h('b', '第一步'), ' 分一分'), cols.el, nextBtn);
    var recap = h('div.story-recap');
    var optWrap = h('div.opts');
    var step2 = h('div.story-step.hidden',
      h('div.step-label', h('b', '第二步'), ' 把三部分连起来，哪一句是主要内容？'), recap, optWrap);

    nextBtn.addEventListener('click', function () {
      if (locked) return;
      placedOk = G.columns({ answer: place }, cols.placement());

(function (Y) {
  'use strict';
  var h = Y.h, U = Y.util, G = Y.grade;

  Y.qtypes.tianji = function (q, ctx) {
    var d = q.data;

    var list = Y.sortable(U.shuffleDifferent(d.king), { numbered: false });
    list.el.classList.add('tj-list');

    var kingCol = h('ol.tj-king', d.king.map(function (k) { return h('li.tj-horse.king', h('span.tj-ico', '🐎'), k); }));
    var rounds = h('ol.tj-rounds', d.king.map(function (_, i) { return h('li.tj-round', '第' + U.cnNum(i + 1) + '局'); }));
    var board = h('div.tj-board',
      h('div.tj-head', h('span', ''), h('span', '齐威王'), h('span', '田忌（你来排）')),
      h('div.tj-grid', rounds, kingCol, list.el));
    var result = h('div.tj-result', { 'aria-live': 'polite' });
    var go = h('button.btn.primary.check-btn', { type: 'button' }, '🏁 开始比赛');

    function maxSpeed() {
      var all = Object.keys(d.speed.king).map(function (k) { return d.speed.king[k]; })
        .concat(Object.keys(d.speed.tian).map(function (k) { return d.speed.tian[k]; }));
      return Math.max.apply(null, all);
    }

    function race(order) {
      var res = G.race(q, order);
      var top = maxSpeed();
      result.innerHTML = '';
      res.forEach(function (r, i) {
        var row = h('div.tj-race' + (r.win ? '.win' : '.lose'),
          h('div.tj-race-title', '第' + U.cnNum(r.round) + '局：', h('b', r.win ? '田忌赢' : '齐威王赢')),
          h('div.tj-lane', h('span.tj-who', '齐威王 · ' + r.king), h('span.tj-track', h('span.tj-bar.king', { style: { width: '0%' } }))),
          h('div.tj-lane', h('span.tj-who', '田忌 · ' + r.tian), h('span.tj-track', h('span.tj-bar.tian', { style: { width: '0%' } }))));
        result.appendChild(row);
        var bars = row.querySelectorAll('.tj-bar');
        setTimeout(function () {
          bars[0].style.width = (d.speed.king[r.king] / top * 100) + '%';
          bars[1].style.width = (d.speed.tian[r.tian] / top * 100) + '%';
        }, 40 + i * 120);
      });
      var wins = res.filter(function (r) { return r.win; }).length;
      result.appendChild(h('p.tj-score', '田忌赢了 ', h('b', String(wins)), ' 局，齐威王赢了 ', h('b', String(3 - wins)), ' 局。',
        wins >= 2 ? ' 🎉 三局两胜！' : ''));
      return wins >= 2;
    }

    go.addEventListener('click', function () {
      if (locked) return;
      var ok = race(list.order());
      ctx.submit(ok);
    });

    return {
      el: h('div.tianji-q', h('p.tip', '拖动右边的马换顺序，或者点两匹马交换。'), board, go, result),
      lock: function () { locked = true; list.lock(); go.disabled = true; },
      retry: function () { locked = false; list.unlock(); go.disabled = false; go.textContent = '🔁 换个顺序再比一次'; },
      reveal: function () { list.setOrder(q.answer); list.mark(function () { return 'ok'; }); race(q.answer); }
    };
  };

(function (Y) {
  'use strict';
  var h = Y.h;

  function renderCard(c) {
    var body = h('div.kcard-body',
      h('div.kcard-top', h('span.chip', c.tag || '知识'), c.by ? h('span.kcard-by', c.by) : null),
      h('h3.kcard-title' + (c.tag === '古诗' || c.tag === '文言文' ? '.poem-font' : ''), c.title),
      h('ul.kcard-points', c.points.map(function (p) { return h('li', p); })));
    if (c.table) {
      body.appendChild(h('table.kcard-table',
        h('thead', h('tr', h('th', '第几次'), h('th', '时间'), h('th', '地点'), h('th', '感受'))),
        h('tbody', c.table.map(function (r) {
          return h('tr', h('td', '第' + Y.util.cnNum(r.n) + '次'),
            h('td', r.time || h('span.todo', '待补录')), h('td', r.place), h('td', r.feeling || h('span.todo', '待补录')));
        }))));
    }
    if (c.route && c.route.list) {
      body.appendChild(h('div.kcard-route', h('b', '游览路线：'),
        c.route.list.map(function (r, j) { return [j ? h('span.route-arrow', ' → ') : null, h('span.route-stop', r)]; })));
    }
    if (c.poems && c.poems.length) {
      body.appendChild(h('div.row-btns.left', c.poems.map(function (id) {
        var p = Y.content.poem(id);
        return h('a.btn.small', { href: '#/poem/' + id }, '🏯 《' + p.title + '》');
      })));
    }
    if (c.tips && c.tips.length) {
      body.appendChild(h('div.kcard-tips', c.tips.map(function (t) {
        return h('p', /^易错/.test(t) ? h('b', '⚠️ ') : h('b', '💡 '), t.replace(/^易错：/, '易错：'));
      })));
    }
    return body;
  }

  /** 返回 { el } */
  Y.cardDeck = function (cards, opts) {
    opts = opts || {};
    var i = Math.max(0, Math.min(cards.length - 1, opts.start || 0));
    var stage = h('div.kcard', { tabindex: '0', 'aria-roledescription': '知识卡', 'aria-live': 'polite' });
    var dots = h('div.kdots');
    var knowBtn = h('button.btn.know-btn', { type: 'button', 'aria-pressed': 'false' });
    var prev = h('button.btn.small.knav', { type: 'button', 'aria-label': '上一张' }, '‹ 上一张');
    var next = h('button.btn.small.knav', { type: 'button', 'aria-label': '下一张' }, '下一张 ›');
    var count = h('span.kcount');

    function draw(dir) {

      stage.innerHTML = '';
      stage.className = 'kcard' + (dir ? ' slide-' + dir : '');

      knowBtn.textContent = known ? '✓ 我懂了' : '我懂了';
      knowBtn.classList.toggle('on', known);

      });
      count.textContent = (i + 1) + ' / ' + cards.length;

    function go(j) {
      if (j < 0 || j >= cards.length || j === i) return;
      var dir = j > i ? 'left' : 'right';
      i = j; Y.sound.play('flip'); draw(dir);
    }

    prev.addEventListener('click', function () { go(i - 1); });
    next.addEventListener('click', function () { go(i + 1); });
    knowBtn.addEventListener('click', function () {
      var c = cards[i], v = !Y.progress.isKnown(c.id);

    stage.addEventListener('keydown', function (e) {

    var sx = null, sy = 0;
    stage.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });

    return { el: h('div.kdeck', stage, h('div.knav-row', prev, count, next), dots, knowBtn) };
  };

  <script>/* js/widgets/tagtext.js */
/* 题型：六要素点选（tagtext）
 * 先点上面的要素标签（时间、地点……），再点短文里对应的那一段。一段只能贴一个标签。 */
(function (Y) {
  'use strict';
  var h = Y.h;

  Y.qtypes.tagtext = function (q, ctx) {
    var labels = q.data.labels;
    var assign = {};      // 要素 -> 片段序号
    var active = null, locked = false;

    var chips = labels.map(function (l) {
      var c = h('button.tag-chip', { type: 'button', 'aria-pressed': 'false' }, l);
      c.addEventListener('click', function () {
        if (locked) return;
        active = l; // 点标签总是选中它（自动跳到下一个标签后，孩子再点一下也不会反而取消）
        draw();
      });
      c._l = l;
      return c;
    });
    var segs = q.data.segments.map(function (t, i) {
      var b = h('button.tag-seg', { type: 'button' }, h('span.tag-seg-text', t));
      b.addEventListener('click', function () {
        if (locked) return;
        var cur = labelAt(i);
        if (active) {
          if (cur) delete assign[cur];
          assign[active] = i;
          // 自动跳到下一个还没贴的标签
          var rest = labels.filter(function (l) { return assign[l] == null; });
          active = rest[0] || null;
          Y.sound.play('tap');
        } else if (cur) {
          delete assign[cur];
        }
        draw();
      });
      return b;
    });
    function labelAt(i) { return labels.filter(function (l) { return assign[l] === i; })[0] || null; }

    var go = h('button.btn.primary.check-btn', { type: 'button' }, '找好了');
    go.addEventListener('click', function () { if (!locked) ctx.submit(Y.grade.tagtext(q, assign)); });

    function draw(marks) {
      chips.forEach(function (c) {
        c.classList.toggle('on', c._l === active);
        c.classList.toggle('used', assign[c._l] != null);
        c.setAttribute('aria-pressed', String(c._l === active));
      });
      segs.forEach(function (b, i) {
        var l = labelAt(i);
        var old = b.querySelector('.tag-badge'); if (old) old.remove();
        b.classList.toggle('tagged', !!l);
        b.classList.remove('ok', 'bad');
        if (l) {
          b.insertBefore(h('span.tag-badge', l), b.firstChild);
          if (marks) b.classList.add(q.answer[l] === i ? 'ok' : 'bad');
        }
      });
      go.disabled = locked || labels.some(function (l) { return assign[l] == null; });
    }
    active = labels[0];
    draw();

    return {
      el: h('div.tagtext-q',
        h('p.tip', '先点一个标签，再点短文里对应的那一段。点错了可以重新贴。'),
        h('div.tag-chips', chips),

      lock: function () { locked = true; active = null; draw(); go.disabled = true; },
      retry: function () {

        labels.forEach(function (l) { if (assign[l] !== q.answer[l]) delete assign[l]; });
        active = labels.filter(function (l) { return assign[l] == null; })[0] || null;

      lock: function () { locked = true; go.disabled = true; },
      retry: function () {

        if (ats.indexOf(at) < 0) { sents[at] && sents[at].classList.add('bad'); at = null; }
        if (kind !== q.answer.kind) kind = null;
        draw();
      },
      reveal: function () {
        at = q.answer.at; kind = q.answer.kind; draw();
        sents.forEach(function (b, i) { b.classList.remove('bad'); if (ats.indexOf(i) >= 0) b.classList.add('ok'); });
        kinds.forEach(function (b) { if (b._k === q.answer.kind) b.classList.add('ok'); });
        go.disabled = true;

  <script>/* js/widgets/letter.js */
/* 题型：书信格式拼图（letter）
 * 信纸上有几个空位，位置分别是：顶格、空两格、右下方。孩子把称呼、问候语、正文……放进正确的空位。
 * 操作：先点一张卡片，再点信纸上的空位；也可以直接拖过去。点已放好的卡片可以拿回来。 */
(function (Y) {
  'use strict';
  var h = Y.h, U = Y.util;
  var POS_LABEL = { left: '顶格', indent: '空两格', right: '右下方' };

  Y.qtypes.letter = function (q, ctx) {
    var pieces = U.shuffle(Object.keys(q.answer));
    var where = {};           // 内容 -> 空位 key
    var selected = null, locked = false;
    var slotEls = {}, cardOf = {};

    var pool = h('div.col-pool.letter-pool');
    var paper = h('div.letter-paper', q.data.slots.map(function (s) {
      var drop = h('div.letter-drop');
      var slot = h('div.letter-slot.pos-' + s.pos, { role: 'button', tabindex: '0', 'aria-label': '信纸上的空位' },
        s.pos === 'indent' ? h('span.indent-mark', { 'aria-hidden': 'true' }, '□□') : null, drop,
        h('span.slot-name', s.key));
      slot._key = s.key; slot._drop = drop;
      slot.addEventListener('click', function (e) {
        if (locked || !selected) return;
        if (e.target.closest && e.target.closest('.col-card')) return;
        put(selected._value, s.key);
      });
      slotEls[s.key] = slot;
      return slot;
    }));

    function occupant(key) { return Object.keys(where).filter(function (p) { return where[p] === key; })[0]; }
    function clearSel() { if (selected) selected.classList.remove('sel'); selected = null; paper.classList.remove('picking'); }
    function put(p, key) {
      clearSel();
      if (key) {
        var old = occupant(key);
        if (old && old !== p) { where[old] = null; pool.appendChild(cardOf[old]); }
        slotEls[key]._drop.appendChild(cardOf[p]);
      } else {
        pool.appendChild(cardOf[p]);
      }
      where[p] = key || null;
      pool.classList.toggle('empty', !pool.children.length);
      Y.sound.play('tap');
      go.disabled = pieces.some(function (x) { return !where[x]; });
    }
    function slotFrom(node) {
      while (node && node !== document.body) { if (node._key) return node; node = node.parentNode; }
      return null;
    }

    pieces.forEach(function (p) {
      var c = h('button.col-card.letter-card', { type: 'button' }, p);
      c._value = p; cardOf[p] = c; where[p] = null;
      Y.drag.attach(c, {
        canDrag: function () { return !locked; },
        onStart: clearSel,
        onDrop: function (x, y, under) { var s = slotFrom(under); if (s) put(p, s._key); else if (where[p]) put(p, null); },
        onTap: function () {
          if (locked) return;
          if (where[p]) {
            if (selected && selected !== c) { put(selected._value, where[p]); return; }
            put(p, null); return;
          }
          if (selected === c) { clearSel(); return; }
          clearSel(); selected = c; c.classList.add('sel'); paper.classList.add('picking');
        }
      });
      pool.appendChild(c);
    });

    var go = h('button.btn.primary.check-btn', { type: 'button', disabled: true }, '拼好了');
    go.addEventListener('click', function () { if (!locked) ctx.submit(Y.grade.letter(q, where)); });

    function mark() {
      pieces.forEach(function (p) {
        cardOf[p].classList.remove('ok', 'bad');
        if (where[p]) cardOf[p].classList.add(where[p] === q.answer[p] ? 'ok' : 'bad');
      });
    }

    return {
      el: h('div.letter-q',
        h('p.tip', '先点一张卡片，再点信纸上的空位。注意看空位的位置：顶格、空两格（□□）、右下方。'),
        pool, paper, go),
      lock: function () { locked = true; clearSel(); go.disabled = true; },
      retry: function () {
        locked = false;
        pieces.forEach(function (p) { if (where[p] && where[p] !== q.answer[p]) put(p, null); });
        go.disabled = true;
      },
      reveal: function () {
        pieces.forEach(function (p) { put(p, q.answer[p]); });
        mark();
        paper.classList.add('revealed');
        go.disabled = true;
      },
      posLabel: POS_LABEL
    };
  };
})(window.YuwenIsland);

</script>
  <script>/* js/core/quiz.js */
/* 答题引擎：一轮题目的流程、反馈、计分、总结。
 * 规则：答错不扣分；第一次错 → 给提示，再试一次；第二次错 → 给讲解，并加一道同类题。
 * 正确率按“第一次就对 = 1 分，提示后答对 = 0.5 分”计算。加练题不计分。 */
(function (Y) {
  'use strict';
  var h = Y.h, U = Y.util;

  var PRAISE = ['太棒了！', '答对啦，真细心！', '好样的！', '你记得真清楚！', '一点就通！', '漂亮，继续加油！', '完全正确！', '这题难不倒你！'];
  var RETRY_PRAISE = ['改对了，真不错！', '再想一想就对了，很棒！', '这次对啦！'];
  var praiseIdx = Math.floor(Math.random() * PRAISE.length);
  function praise(second) {
    if (second) return U.pick(RETRY_PRAISE);
    praiseIdx = (praiseIdx + 1) % PRAISE.length;
    return PRAISE[praiseIdx];
  }

  function lessonChip(q) {
    var ls = Y.content.lessonOf(q);
    if (!ls) return null;
    return h('span.chip.soft', ls === '习作' || ls === '快乐读书吧' ? ls : '《' + ls + '》');
  }

  /** 按正确率给星：≥60% 一星，≥80% 两星，100% 三星 */
  function starsFor(pct) { return pct >= 100 ? 3 : pct >= 80 ? 2 : pct >= 60 ? 1 : 0; }

  Y.quiz = {
    starsFor: starsFor,

    /**
     * opts: { title, icon, theme, back, pool: [题目], count, mode: 'practice'|'test'|'dictation',
     *         islandId, againHref, intro }
     */
    run: function (opts) {
      var mode = opts.mode || 'practice';
      var picked = U.sample(opts.pool, Math.min(opts.count || 10, opts.pool.length));
      var items = picked.map(function (q) { return { q: q, result: null, bonus: false }; });
      var used = {};
      picked.forEach(function (q) { used[q.id] = true; });
      var idx = 0;
      var total = items.length;

      var body = Y.ui.page({ title: opts.title, icon: opts.icon, theme: opts.theme, back: opts.back, cls: 'quiz-page' });
      var head = h('div.quiz-head');
      var stage = h('div.quiz-stage');
      body.appendChild(head);
      body.appendChild(stage);

      if (!items.length) {
        stage.appendChild(h('div.empty-card', h('p', '这里暂时还没有题目。'), h('a.btn', { href: opts.back }, '返回')));
        return;
      }

      function scoredDone() { return items.filter(function (it) { return !it.bonus && it.result; }).length; }

      function drawHead(it) {
        head.innerHTML = '';
        var n = scoredDone() + (it && !it.bonus && !it.result ? 1 : 0);
        head.appendChild(h('div.quiz-count',
          it && it.bonus ? h('span.chip.bonus', '加练一题') : h('span', '第 ', h('b', String(Math.min(n, total))), ' / ' + total + ' 题'),
          mode === 'test' ? h('span.chip.test', '闯关') : null));
        head.appendChild(Y.ui.bar(scoredDone() / total * 100));
      }

      function show() {
        if (idx >= items.length) return summary();
        var it = items[idx];
        var q = it.q;
        drawHead(it);
        stage.innerHTML = '';
        var attempts = 0;
        var fb = h('div.feedback', { 'aria-live': 'polite' });
        var nextBar = h('div.next-bar.hidden');
        var view;

        var ctx = {
          submit: function (correct, info) {
            info = info || {};
            view.lock();
            if (correct) {
              it.result = attempts === 0 ? 'first' : 'second';
              finish(true);
            } else {
              attempts++;
              if (attempts === 1 && !info.final) {
                Y.sound.play('wrong');
                fb.className = 'feedback hint';
                fb.innerHTML = '';
                fb.appendChild(h('div.fb-title', '💡 差一点点！看看提示，再试一次'));
                if (q.hint) fb.appendChild(h('p.fb-text', q.hint));
                setTimeout(function () { view.retry(); }, 350);
              } else {
                it.result = 'wrong';
                finish(false, info.self);
              }
            }
          }
        };

        function finish(ok, selfGraded) {
          Y.progress.record(q, it.result);
          fb.innerHTML = '';
          if (ok) {
            Y.sound.play('correct');
            Y.ui.stamp(it.result === 'first' ? '对' : '好', card);
            fb.className = 'feedback good';
            fb.appendChild(h('div.fb-title', '🌸 ' + praise(it.result === 'second')));
          } else {
            if (!selfGraded) view.reveal();
            fb.className = 'feedback explain';
            fb.appendChild(h('div.fb-title', selfGraded ? '📒 没关系，已经放进错题本，下次再写一遍' : '🍵 没关系，我们一起来看看'));
            // 加一道同类题
            var sim = Y.content.similar(q, used);
            if (sim) {
              used[sim.id] = true;
              items.splice(idx + 1, 0, { q: sim, result: null, bonus: true });
            }
          }
          if (q.explanation) fb.appendChild(h('p.fb-text', q.explanation));
          if (!ok && items[idx + 1] && items[idx + 1].bonus && items[idx + 1].q !== q) {
            fb.appendChild(h('p.fb-text.soft', '下面再来一道同类题，巩固一下。'));
          }
          nextBtn.textContent = idx + 1 >= items.length ? '看看这一轮的成绩' : '下一题 →';
          nextBar.classList.remove('hidden');
          drawHead(null);
          setTimeout(function () {
            nextBtn.focus({ preventScroll: true });
            // 让讲解和“下一题”按钮都露出来；讲解太长时优先露出讲解开头
            var r = fb.getBoundingClientRect(), vh = window.innerHeight;
            var target = nextBar.getBoundingClientRect().bottom - vh + 16;
            if (r.top - target < 70) target = r.top - 70;
            if (target > 0) window.scrollBy({ top: target, behavior: 'smooth' });
          }, 60);
        }

        var renderer = Y.qtypes[q.type];
        view = renderer(q, ctx);
        var card = h('section.q-card', { 'data-qid': q.id },
          h('div.q-meta', h('span.chip', Y.content.skillLabel(q.skill)), lessonChip(q)),
          h('h2.q-prompt', q.prompt),
          q.data && q.data.quote ? h('blockquote.q-quote.poem-font', q.data.quote) : null,
          view.el);
        var nextBtn = h('button.btn.primary.wide', { type: 'button', onclick: function () { idx++; show(); } }, '下一题 →');
        nextBar.appendChild(nextBtn);
        stage.appendChild(card);
        stage.appendChild(fb);
        stage.appendChild(nextBar);
        window.scrollTo(0, 0);
      }

      function summary() {
        var scored = items.filter(function (it) { return !it.bonus; });
        var first = scored.filter(function (it) { return it.result === 'first'; }).length;
        var second = scored.filter(function (it) { return it.result === 'second'; }).length;
        var pct = Math.round((first + second * 0.5) / scored.length * 100);
        head.innerHTML = '';
        stage.innerHTML = '';
        var box = h('section.summary');
        if (mode === 'test') {
          var stars = starsFor(pct);
          var best = opts.islandId ? Y.progress.setStars(opts.islandId, stars, pct) : stars;
          if (stars) Y.sound.play('star');
          box.appendChild(h('div.sum-stars', Y.ui.stars(stars, true)));
          box.appendChild(h('h2.sum-title', stars === 3 ? '满分通关！' : stars ? '闯关成功！' : '离星星只差一点点'));
          if (best > stars) box.appendChild(h('p.sum-sub', '最高纪录：' + best + ' 颗星，已经帮你保留啦。'));
        } else {
          Y.sound.play('star');
          box.appendChild(h('div.sum-seal', '练'));
          box.appendChild(h('h2.sum-title', '这一轮练完啦！'));
        }
        box.appendChild(h('div.sum-nums',
          h('div.sum-num', h('b', String(first)), h('span', '一次就对')),
          h('div.sum-num', h('b', String(second)), h('span', '提示后改对')),
          h('div.sum-num', h('b', pct + '%'), h('span', '正确率'))));

        // 薄弱点：按“技能 + 篇目”归并
        var weak = {};
        items.forEach(function (it) {
          if (it.result === 'first') return;
          var ls = Y.content.lessonOf(it.q);
          var k = Y.content.skillLabel(it.q.skill) + (ls ? '（' + (ls === '习作' ? ls : '《' + ls + '》') + '）' : '');
          weak[k] = true;
        });
        var wk = Object.keys(weak);
        if (wk.length) {
          box.appendChild(h('div.sum-weak', h('p', '这几个地方再练练会更棒：'), h('ul', wk.map(function (k) { return h('li', k); }))));
        } else {
          box.appendChild(h('p.sum-sub', '每一题都是一次就答对，真了不起！'));
        }
        if (opts.onFinish) {
          try { opts.onFinish({ pct: pct, first: first, second: second, total: scored.length }, box); } catch (e) { /* 忽略 */ }
        }
        if (Y.checkNewBadges) Y.checkNewBadges(box);
        box.appendChild(h('div.sum-actions',
          h('a.btn.primary', { href: opts.againHref || location.hash, onclick: function (e) { if ((opts.againHref || location.hash) === location.hash) { e.preventDefault(); Y.router.resolve(); } } }, '再来一轮'),
          h('a.btn', { href: opts.back }, '返回')));
        stage.appendChild(box);
        window.scrollTo(0, 0);
      }

      show();
    }
  };
})(window.YuwenIsland);

</script>

  /** 知识卡里的表格（如《繁星》三次看星）补录完整后，自动生成配对题 */
  function tableQuestions() {

            id: c.id + '-table-' + f[0], unit: u[n].unit, island: 'u' + u[n].unit, lesson: c.lesson || '',
            skill: 'reading-order', type: 'match', difficulty: 2,

            hint: '按顺序回忆：' + t.map(function (r) { return r.place; }).join('、') + '。',

  /** 由诗文原文自动生成：排序题、上下句默写自查卡、整篇默写卡（保证和原文逐字一致） */

    var out = [];

      id: poem.id + '-order', unit: poem.unit, island: 'poems', poemId: poem.id,

      hint: isWy ? '想一想故事先发生了什么，后发生了什么。' : '先找出第一句：' + poem.lines[0].charAt(0) + '……',
      explanation: '正确顺序：' + poem.lines.join(''),
      source: 'textbook', generated: true
    });
    if (!isWy) {
      for (var i = 0; i < poem.lines.length; i += 2) {
        out.push({
          id: poem.id + '-dict-' + (i / 2 + 1), unit: poem.unit, island: 'poems', poemId: poem.id,
          skill: 'poem-dictation', type: 'selfcheck', difficulty: 2,

      id: poem.id + '-dict-all', unit: poem.unit, island: 'poems', poemId: poem.id,

      answer: poem.lines.join(''),

  /** 听写卡：家长补录词语表后自动生成（朗读词语，孩子在纸上写，再翻卡自查） */
  function dictationCards() {
    var out = [];
    ((Y.data.words && Y.data.words.lessons) || []).forEach(function (ls, li) {

    Object.keys(Y.data.banks || {}).forEach(function (k) {
      (Y.data.banks[k] || []).forEach(function (q) { if (!q.island) q.island = k; all.push(q); });
    });

    all.forEach(function (q) { byId[q.id] = q; });

    pool: function (f) {

        if (f.unit != null && q.unit !== f.unit) return false;
        if (f.poemId && q.poemId !== f.poemId) return false;
        if (f.types && f.types.indexOf(q.type) < 0) return false;
        if (f.noTypes && f.noTypes.indexOf(q.type) >= 0) return false;
        return true;

    },

    /** 找一道同类题（同技能、同岛，优先同一篇），用于“答错两次后再练一道” */

      });
      if (!cands.length) return null;
      var same = cands.filter(function (x) { return q.poemId && x.poemId === q.poemId; });
      return U.pick(same.length ? same : cands);
    },

    /** 遍历全部数据，列出标了 needsCheck 的条目，给家长页用 */
    collectNeedsCheck: function (root) {
      var out = [];
      var seen = [];
      (function walk(node, path, ctxLabel) {
        if (!node || typeof node !== 'object') return;
        if (seen.indexOf(node) >= 0) return;
        seen.push(node);
        var label = node.title || node.name || node.word || node.prompt || ctxLabel;
        if (/\.element$/.test(path)) label = '语文要素：' + node.text;

          out.push({ path: path, label: pre + (label || path), note: node.checkNote || '', id: node.id || null, text: node.text || '' });
        }
        Object.keys(node).forEach(function (k) {
          walk(node[k], path ? path + '.' + k : k, node.title || ctxLabel);
        });
      })(root || Y.data, '', '');
      return out;
    }
  };

(function (Y) {

  /* 可以重复的伪随机：同一天抽到的题目相同 */
  function seeded(seedStr) {

    for (var i = 0; i < seedStr.length; i++) { x ^= seedStr.charCodeAt(i); x = Math.imul(x, 16777619); }
    return function () {

      return ((x >>> 0) % 100000) / 100000;
    };

    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function islands() {
