  }
  function poolOf(isl) {
    return isl.unit ? C().unitPool(isl.unit) : C().pool({ island: isl.id, noTypes: ['selfcheck'] });
  }

  var TYPE_LABEL = {
    single: '单选', multi: '多选', judge: '判断', blank: '填空', input: '填写', order: '排序', match: '连线',
    columns: '分类', segment: '断句', selfcheck: '默写听写', story3: '起因经过结果', tianji: '田忌赛马',
    tagtext: '六要素', annotate: '批注', letter: '书信格式'
  };

  var L = Y.learn = {
    TYPE_LABEL: TYPE_LABEL,
    islands: islands,

    /** 错题本：[{ q, s }]，最近答错的在前 */
    wrongList: function (p) {
      return Object.keys(p.q).filter(function (id) { return p.q[id].wrong; })
        .map(function (id) { return { q: C().byId(id), s: p.q[id] }; })
        .filter(function (x) { return x.q; })
        .sort(function (a, b) { return (b.s.t || 0) - (a.s.t || 0); });
    },

    /** 错题所属的岛（古诗文题算在背诵馆） */
    islandOf: function (q) { return q.island; },

    /** 各岛正确率：答对次数 /（答对 + 答错） */
    islandStats: function (p) {
      return islands().map(function (isl) {
        var r = 0, w = 0, tried = 0;
        poolOf(isl).forEach(function (q) {
          var s = p.q[q.id]; if (!s) return;
          tried++; r += s.r; w += s.w;
        });
        return { id: isl.id, name: isl.name, tried: tried, total: poolOf(isl).length, right: r, wrong: w,
          acc: r + w ? Math.round(r / (r + w) * 100) : null, stars: p.stars[isl.id] || 0 };
      });
    },

    /** 高频错题：答错次数最多的 n 道 */
    topWrong: function (p, n) {
      return Object.keys(p.q).filter(function (id) { return p.q[id].w > 0; })
        .map(function (id) { return { q: C().byId(id), s: p.q[id] }; })
        .filter(function (x) { return x.q; })
        .sort(function (a, b) { return b.s.w - a.s.w || (b.s.t || 0) - (a.s.t || 0); })
        .slice(0, n || 10);
    },

    /**
     * 每日一练：10 题，固定含 2 道古诗文；其余优先错题，再补薄弱单元，最后随机。
     * 同一天结果固定（按日期做随机种子）。
     */
    dailyIds: function (p, dateStr) {
      var rnd = seeded('yw4a-' + dateStr);
      var used = {};
      var out = [];
      function take(list, n) {
        for (var i = 0; i < list.length && n > 0; i++) {
          var q = list[i];
          if (!q || used[q.id] || q.type === 'selfcheck') continue;
          used[q.id] = true; out.push(q.id); n--;
        }
        return n;
      }
      var wrong = L.wrongList(p).map(function (x) { return x.q; });
      var poemPool = C().pool({ island: 'poems', noTypes: ['selfcheck'] });
      // ① 2 道古诗文：先挑古诗文错题，不够再随机
      var left = take(seededShuffle(wrong.filter(function (q) { return q.island === 'poems'; }), rnd), 2);
      take(seededShuffle(poemPool, rnd), left);
      // ② 错题（非古诗文）
      var rest = take(seededShuffle(wrong.filter(function (q) { return q.island !== 'poems'; }), rnd), 8);
      // ③ 薄弱的岛：正确率低的在前，没做过的也算薄弱
      if (rest > 0) {
        var stats = L.islandStats(p).sort(function (a, b) {
          var x = a.acc == null ? -1 : a.acc, y = b.acc == null ? -1 : b.acc;
          return x - y || rnd() - 0.5;
        });
        for (var i = 0; i < stats.length && rest > 0; i++) {
          var isl = islands().filter(function (x) { return x.id === stats[i].id; })[0];
          var pool = seededShuffle(poolOf(isl), rnd);
          // 每个薄弱的岛最多出 3 题，让题目分散一点
          var k = Math.min(3, rest);
          rest -= k - take(pool, k);
        }
      }
      if (rest > 0) take(seededShuffle(C().all(), rnd), rest);
      return out;
    },

    /** 连续学习天数：以今天（或昨天）为结尾往前数 */
    streak: function (days, todayStr) {
      var set = {};
      (days || []).forEach(function (d) { set[d] = true; });
      var d = new Date(todayStr + 'T12:00:00');
      if (!set[todayStr]) d.setDate(d.getDate() - 1);
      var n = 0;
      while (set[Y.util.today(d)]) { n++; d.setDate(d.getDate() - 1); }
      return n;
    },

    /** 某个技能下“答对过”的题数 */
    skillRight: function (p, skills) {
      return C().all().filter(function (q) { return skills.indexOf(q.skill) >= 0 && p.q[q.id] && p.q[q.id].r > 0; }).length;
    },

    /**
     * 徽章。extra: { today, dailyDone: [日期], outlinesDone: 数量 }
     * 返回 [{ id, icon, name, desc, got, cur, total }]
     */
    badges: function (p, extra) {
      extra = extra || {};
      var poems = (Y.data.poems || []).filter(function (x) { return x.kind === 'poem'; });
      var wenyan = (Y.data.poems || []).filter(function (x) { return x.kind === 'wenyan'; });
      function recited(list) { return list.filter(function (x) { return p.recite[x.id] && p.recite[x.id][2]; }).length; }
      var units = (Y.data.islands || []);
      var cleared = Object.keys(p.q).filter(function (id) { return p.q[id].cleared; }).length;
      var three = Object.keys(p.stars).filter(function (k) { return p.stars[k] >= 3; }).length;
      var list = [
        { id: 'poet', icon: '🏯', name: '古诗小达人', desc: '背会全部 6 首古诗（三关全过）', cur: recited(poems), total: poems.length },
        { id: 'wenyan', icon: '📜', name: '文言文小先生', desc: '背会 2 篇文言文（三关全过）', cur: recited(wenyan), total: wenyan.length },
        { id: 'question', icon: '❓', name: '提问高手', desc: '答对 8 道提问分类、筛选问题的题', cur: L.skillRight(p, ['question-classify', 'question-best']), total: 8 },
        { id: 'annotate', icon: '✏️', name: '批注能手', desc: '答对 6 道批注题', cur: L.skillRight(p, ['annotate']), total: 6 },
        { id: 'guide', icon: '🎤', name: '小小讲解员', desc: '答对 4 道小小讲解员的题', cur: L.skillRight(p, ['guide-talk']), total: 4 },
        { id: 'streak3', icon: '🔥', name: '连续学习 3 天', desc: '连续 3 天来语文岛学习', cur: L.streak(p.days, extra.today || Y.util.today()), total: 3 },
        { id: 'letter', icon: '✉️', name: '书信小能手', desc: '答对 6 道书信格式题', cur: L.skillRight(p, ['letter-format']), total: 6 },
        { id: 'star', icon: '🌟', name: '闯关新星', desc: '任意一座岛拿到 3 颗星', cur: Math.min(three, 1), total: 1 },
        { id: 'islands', icon: '🗺️', name: '八岛巡游', desc: '8 个单元岛都至少得 1 颗星', cur: units.filter(function (u) { return p.stars[u.id] >= 1; }).length, total: units.length },
        { id: 'cleaner', icon: '🧹', name: '错题克星', desc: '从错题本里消灭 5 道错题', cur: cleared, total: 5 },
        { id: 'daily', icon: '📅', name: '每日打卡', desc: '完成 5 次每日一练', cur: (extra.dailyDone || []).length, total: 5 },
        { id: 'writer', icon: '📮', name: '习作小作家', desc: '完成 3 份习作提纲', cur: extra.outlinesDone || 0, total: 3 }
      ];
      list.forEach(function (b) { b.cur = Math.min(b.cur, b.total); b.got = b.cur >= b.total; });
      return list;
    },

    /** 导出全部本地数据（键名去掉前缀） */
    exportAll: function () {
      var out = { app: '语文岛', version: Y.version, exportedAt: new Date().toISOString(), data: {} };
      Y.store.keys().forEach(function (k) { out.data[k] = Y.store.get(k, null); });
      return out;
    }
  };
})(window.YuwenIsland);

  <script>/* js/pages/home.js */
/* 首页：语文岛地图。8 个单元岛 + 4 个专项岛，全部默认开放。 */
(function (Y) {
  'use strict';
  var h = Y.h;

  /** 岛的完成度（0~100）：做对过的题 / 题库题数；古诗文馆再和背诵进度各占一半 */
  Y.islandProgress = function (islandId) {
    var unitNo = /^u(\d)$/.test(islandId) ? parseInt(islandId.slice(1), 10) : 0;
    var pool = unitNo ? Y.content.unitPool(unitNo) : Y.content.pool({ island: islandId, noTypes: ['selfcheck'] });
    var qd = Y.progress.data().q;
    var done = pool.filter(function (q) { return qd[q.id] && qd[q.id].r > 0; }).length;
    var pct = pool.length ? done / pool.length * 100 : 0;
    var u = unitNo && Y.content.unit(unitNo);
    if (u) {
      // 单元岛：题目占 7 成，知识卡“我懂了”占 3 成
      var known = u.cards.filter(function (c) { return Y.progress.isKnown(c.id); }).length;
      pct = pct * 0.7 + known / u.cards.length * 30;
    }
    if (islandId === 'writing') {
      // 习作小助手：每篇提纲完成算一半，自查清单全部勾完算另一半
      var ws = Y.data.writing || [], got = 0;
      ws.forEach(function (w) {
        var o = Y.store.get('outline:' + w.id, null), c = Y.store.get('check:' + w.id, {}) || {};
        if (o && o.done) got += 0.5;
        if (w.checklist.every(function (_, i) { return c[i]; })) got += 0.5;
      });
      pct = ws.length ? got / ws.length * 100 : 0;
    }
    if (islandId === 'poems') {
      var levels = 0, poems = Y.data.poems;
      poems.forEach(function (p) { levels += Y.progress.recite(p.id).filter(Boolean).length; });
      pct = pct / 2 + levels / (poems.length * 3) * 50;
    }
    return { stars: Y.progress.stars(islandId), pct: Math.round(pct) };
  };

  function hello() {
    var hr = new Date().getHours();
    if (hr < 11) return '早上好';
    if (hr < 14) return '中午好';
    if (hr < 18) return '下午好';
    return '晚上好';
  }

  function islandCard(isl, kind, i) {
    var pr = Y.islandProgress(isl.id);
    var href = isl.href || (kind === 'unit' ? '#/unit/' + isl.unit : '#/island/' + isl.id);
    return h('a.island.' + kind + '.shape' + (i % 4), { href: href, style: { '--c': isl.color } },
      h('span.island-ico', { 'aria-hidden': 'true' }, isl.icon),
      kind === 'unit' ? h('span.island-no', '第' + Y.util.cnNum(isl.unit) + '单元') : null,
      h('span.island-name', isl.name),
      kind === 'special' && isl.desc ? h('span.island-desc', isl.desc) : null,
      h('span.island-foot', Y.ui.stars(pr.stars), h('span.island-pct', pr.pct + '%')),
      Y.ui.bar(pr.pct));
  }

  Y.router.add('/', function () {
    var body = Y.ui.page({ nav: 'home', cls: 'home-page' });
    body.appendChild(h('header.home-hero',
      h('div.hero-seal', { 'aria-hidden': 'true' }, h('span', '语文'), h('span', '岛')),
      h('div.hero-text',
        h('p.hero-hello', hello() + '，小岛主！'),
        h('h1.hero-title', '语文岛 · 四年级上册'),
        h('p.hero-sub', '今天想去哪座岛看看？'))));

    body.appendChild(h('h2.sec-title', h('span.sec-dot'), '专项岛'));
    body.appendChild(h('div.island-grid', Y.data.specials.map(function (s, i) { return islandCard(s, 'special', i); })));
    body.appendChild(h('h2.sec-title', h('span.sec-dot'), '单元岛'));
    body.appendChild(h('div.island-grid', Y.data.islands.map(function (s, i) { return islandCard(s, 'unit', i + 1); })));
    body.appendChild(h('p.home-foot', '统编版 2026 秋 · 四年级上册复习'));
  });
})(window.YuwenIsland);

  <script>/* js/pages/poems.js */
/* 🏯 古诗文背诵馆：馆首页、单篇页（跟读、注释、大意）、渐进遮字背诵、各种练习入口。 */
(function (Y) {
  'use strict';
  var h = Y.h, U = Y.util;
  var THEME = '#9b3b2f';
  var LEVEL_TIPS = ['遮住每句最后一个字', '遮住每句的后一半', '全部遮住，只留每句第一个字'];

  function hall() { return Y.data.specials.filter(function (s) { return s.id === 'poems'; })[0]; }
  function byline(p) { return p.kind === 'wenyan' ? '文言文' : '［' + p.dynasty + '］' + p.author; }
  function unitLabel(p) { return '第' + U.cnNum(p.unit) + '单元'; }

  function reciteSeals(poemId) {
    var r = Y.progress.recite(poemId);
    return h('span.recite-seals', { 'aria-label': '背诵进度：已过 ' + r.filter(Boolean).length + ' 关' },
      ['一', '二', '三'].map(function (t, i) { return h('span.rseal' + (r[i] ? '.on' : ''), t); }));
  }

  /* ---------- 馆首页 ---------- */
  Y.router.add('/poems', function () {
    var isl = hall();
    var body = Y.ui.page({ title: isl.name, icon: isl.icon, back: '#/', theme: THEME, cls: 'poems-page' });
    var pr = Y.islandProgress('poems');
    body.appendChild(h('section.hall-hero',
      h('div.hall-hero-text',
        h('p.hall-lead', '六首古诗，两篇文言文'),
        h('p.hall-sub', '先跟读，再闯三关背诵，最后默写自查。')),
      h('div.hall-hero-stat', Y.ui.stars(pr.stars, true), h('span', '完成 ' + pr.pct + '%'))));

    body.appendChild(h('div.action-grid',
      h('a.action.big', { href: '#/quiz/poems?mode=test' }, h('span.action-ico', '🏆'), h('b', '闯关测验'), h('small', '15 题，按正确率得星')),
      h('a.action', { href: '#/quiz/poems?mode=practice' }, h('span.action-ico', '✏️'), h('b', '练一练'), h('small', '10 题')),
      h('a.action', { href: '#/quiz/poems?mode=dictation' }, h('span.action-ico', '📝'), h('b', '默写自查'), h('small', '纸上写，翻卡对照'))));

    [['poem', '古诗'], ['wenyan', '文言文']].forEach(function (g) {
      body.appendChild(h('h2.sec-title', h('span.sec-dot'), g[1]));
      body.appendChild(h('div.poem-list', Y.data.poems.filter(function (p) { return p.kind === g[0]; }).map(function (p) {
        return h('a.poem-card', { href: '#/poem/' + p.id },
          h('span.poem-card-title.poem-font', p.title),
          h('span.poem-card-by', byline(p) + ' · ' + unitLabel(p)),
          h('span.poem-card-first.poem-font', p.lines[0]),
          reciteSeals(p.id));
      })));
    });
  });

  /* ---------- 诗文正文（跟读高亮用） ---------- */
  function poemText(p) {
    var wrap = h('div.poem-text' + (p.kind === 'wenyan' ? '.prose' : ''));
    var rows = p.lines.map(function (l) { return h('div.poem-line', l); });
    rows.forEach(function (r) { wrap.appendChild(r); });
    return { el: wrap, rows: rows };
  }

  function readAlong(p, text) {
    if (!Y.speech.enabled()) return null;
    var playing = false;
    var btn = h('button.btn.read-btn', { type: 'button', 'aria-pressed': 'false' }, Y.ui.svg('speaker'), h('span', '跟我读'));
    function stop() {
      playing = false; Y.speech.stop();
      text.rows.forEach(function (r) { r.classList.remove('reading'); });
      btn.lastChild.textContent = '跟我读'; btn.setAttribute('aria-pressed', 'false');
    }
    btn.addEventListener('click', function () {
      if (playing) return stop();
      playing = true;
      btn.lastChild.textContent = '停一停'; btn.setAttribute('aria-pressed', 'true');
      var head = p.kind === 'wenyan' ? [p.title] : [p.title + '，' + p.dynasty + '，' + p.author];
      Y.speech.speakLines(head.concat(p.lines), {
        rate: 0.7,
        onLine: function (i) {
          text.rows.forEach(function (r, j) { r.classList.toggle('reading', j === i - 1); });
        },
        onDone: stop
      });
    });
    Y.router.onLeave(stop);
    return btn;
  }

  /* ---------- 单篇页 ---------- */
  Y.router.add('/poem/:id', function (params) {
    var p = Y.content.poem(params.id);
    if (!p) return Y.router.go('#/poems');
    var body = Y.ui.page({ title: p.title, back: '#/poems', theme: THEME, cls: 'poem-page' });
    var text = poemText(p);
    body.appendChild(h('section.poem-sheet',

      h('p.poem-by', byline(p)),
      text.el,
      readAlong(p, text),
      h('span.ink-dot', { 'aria-hidden': 'true' })));

    body.appendChild(h('section.card',
      h('h3.card-title', '📌 字词小注'),
      h('div.note-list', p.notes.map(function (n) {
        return h('div.note', h('b.poem-font', n.word), n.pinyin ? h('span.note-py', n.pinyin) : null, h('span', n.meaning));
      }))));

    body.appendChild(h('section.card',
      h('h3.card-title', p.kind === 'wenyan' ? '💬 译文' : '💬 说说大意'),
      h('p.card-text', p.meaning.text)));

    body.appendChild(h('section.card', p.points.map(function (pt) {
      return h('div.point', h('h3.card-title', '🌟 ' + pt.label), h('p.card-text', pt.text));
    })));

    var r = Y.progress.recite(p.id);
    body.appendChild(h('div.action-grid',
      h('a.action.big', { href: '#/poem/' + p.id + '/recite' }, h('span.action-ico', '🙈'), h('b', '遮字背诵'), h('small', '三关 · ', reciteSeals(p.id))),
      h('a.action', { href: '#/quiz/poems?mode=practice&poem=' + p.id }, h('span.action-ico', '✏️'), h('b', '本篇练一练')),
      h('a.action', { href: '#/quiz/poems?mode=dictation&poem=' + p.id }, h('span.action-ico', '📝'), h('b', '默写自查'))));
    if (r[2]) body.appendChild(h('p.done-note', '🎉 你已经背会这一篇啦！'));
  });

  /* ---------- 渐进遮字背诵 ---------- */
  Y.router.add('/poem/:id/recite', function (params, query) {
    var p = Y.content.poem(params.id);
    if (!p) return Y.router.go('#/poems');
    var r = Y.progress.recite(p.id);
    var level = parseInt(query.level, 10);

    var body = Y.ui.page({ title: '背诵《' + p.title + '》', back: '#/poem/' + p.id, theme: THEME, cls: 'recite-page' });

    body.appendChild(h('div.level-tabs', { role: 'tablist' }, [1, 2, 3].map(function (lv) {
      return h('a.level-tab' + (lv === level ? '.on' : '') + (r[lv - 1] ? '.passed' : ''),
        { href: '#/poem/' + p.id + '/recite?level=' + lv, role: 'tab', 'aria-selected': String(lv === level) },
        h('b', '第' + U.cnNum(lv) + '关'), r[lv - 1] ? h('small', '已过 ✓') : h('small', ' '));
    })));

    var m = Y.maskRecite(p, level);
    body.appendChild(h('section.poem-sheet',
      h('p.level-tip', LEVEL_TIPS[level - 1]),
      h('h2.poem-title.poem-font', p.title),
      h('p.poem-by', byline(p)),
      m.el,
      h('p.tip.center', '先小声背一遍。想不起来就点一下方块偷看，没关系的。')));

    var actions = h('div.self-eval',
      h('button.btn.good.wide', { type: 'button', onclick: pass }, '😊 背出来了'),
      h('button.btn.soft.wide', { type: 'button', onclick: notYet }, '🤔 还不熟'));
    body.appendChild(actions);
    body.appendChild(h('div.row-btns',
      h('button.btn.small', { type: 'button', onclick: function () { m.revealAll(); } }, '全部显示'),
      h('button.btn.small', { type: 'button', onclick: function () { m.hideAll(); } }, '重新遮上')));

    function pass() {
      Y.progress.setRecite(p.id, level, true);
      Y.sound.play(level === 3 ? 'star' : 'correct');
      Y.ui.stamp('过', document.querySelector('.poem-sheet'));
      setTimeout(function () { if (Y.checkNewBadges) Y.checkNewBadges(); }, 600);
      var tail = m.peeks() ? '（偷看了 ' + m.peeks() + ' 个字，下次争取少看几个～）' : '一个字都没偷看，真厉害！';
      if (level < 3) {

          buttons: [

(function (Y) {
  'use strict';

  function islandName(id) {
    var u = (Y.data.islands || []).filter(function (x) { return x.id === id; })[0];
    if (u) return '第' + U.cnNum(u.unit) + '单元';
    var s = Y.content.special(id);
    return s ? s.name : id;
  }
  function qLabel(q) {
    var ls = Y.content.lessonOf(q);
    return (ls ? (ls === '习作' || ls === '快乐读书吧' ? ls : '《' + ls + '》') + ' · ' : '') + Y.content.skillLabel(q.skill);
  }

  /** 题干太笼统时（如“选字填空”），补一行具体内容 */
  function preview(q) {
    var d = q.data || {};
    if (d.template) return d.template.replace(/\{\}/g, '＿');
    if (d.quote) return d.quote;
    if (d.text) return d.text;
    return '';

  /** 新得到的徽章：和已经提示过的比一比，返回新得的 */
  Y.checkNewBadges = function (container) {
    var seen = Y.store.get('badgesSeen', []) || [];
    var fresh = Y.badgeList().filter(function (b) { return b.got && seen.indexOf(b.id) < 0; });
    if (!fresh.length) return [];
    Y.store.set('badgesSeen', seen.concat(fresh.map(function (b) { return b.id; })));
    if (container) {
      container.appendChild(h('a.new-badge', { href: '#/badges' },
        h('span.badge-ico', fresh[0].icon), h('span', h('b', '获得新徽章！'), h('small', fresh.map(function (b) { return b.name; }).join('、')))));
    } else {
      Y.ui.toast('🏅 获得新徽章：' + fresh.map(function (b) { return b.name; }).join('、'));
    }
    Y.sound.play('star');
    return fresh;

        })))));

        return h('li', h('b', x.q.prompt), h('small', islandName(x.q.island) + ' · ' + qLabel(x.q) + ' · 错 ' + x.s.w + ' 次' + (x.s.wrong ? '（还在错题本里）' : '（已移出）')));

  <script>/* js/pages/misc.js */
/* 设置、家长入口，以及还在建设中的页面。 */
(function (Y) {
  'use strict';
  var h = Y.h, U = Y.util;

  /* ---------- 设置 ---------- */
  function toggle(label, desc, key, disabledNote) {
    var on = Y.settings.get()[key];
    var b = h('button.switch' + (on ? '.on' : ''), { type: 'button', role: 'switch', 'aria-checked': String(on), 'aria-label': label },
      h('span.switch-knob'));
    if (disabledNote) { b.disabled = true; b.classList.remove('on'); b.setAttribute('aria-checked', 'false'); }
    b.addEventListener('click', function () {
      var v = !Y.settings.get()[key];
      Y.settings.set(key, v);
      b.classList.toggle('on', v); b.setAttribute('aria-checked', String(v));
      if (key === 'sound' && v) Y.sound.play('correct');
    });
    return h('div.set-row', h('div.set-text', h('b', label), h('small', disabledNote || desc)), b);
  }

  Y.router.add('/settings', function () {
    var body = Y.ui.page({ title: '设置', icon: '⚙️', nav: 'settings' });
    var s = Y.settings.get();
    var sizes = h('div.seg-ctl', { role: 'radiogroup', 'aria-label': '字号' }, [['normal', '标准'], ['large', '大']].map(function (o) {
      var b = h('button.seg-opt' + (s.fontSize === o[0] ? '.on' : ''), { type: 'button', role: 'radio', 'aria-checked': String(s.fontSize === o[0]) }, o[1]);
      b.addEventListener('click', function () {
        Y.settings.set('fontSize', o[0]);
        Array.prototype.forEach.call(sizes.children, function (x) { x.classList.remove('on'); x.setAttribute('aria-checked', 'false'); });
        b.classList.add('on'); b.setAttribute('aria-checked', 'true');
      });
      return b;
    }));
    body.appendChild(h('section.card.settings',
      toggle('音效', '答对、答错时的提示音', 'sound'),
      toggle('朗读', '古诗跟读、听写时朗读', 'speech', Y.speech.supported ? '' : '这个浏览器不支持朗读，换 Safari 或 Chrome 试试'),
      h('div.set-row', h('div.set-text', h('b', '字号'), h('small', '觉得字小就选“大”')), sizes)));
    body.appendChild(h('section.card.settings',
      h('a.set-row.link', { href: '#/parent-gate' }, h('div.set-text', h('b', '👨‍👩‍👧 家长入口'), h('small', '查看学习情况、待核对清单')), h('span.chev', '›'))));
    if (!Y.store.available) body.appendChild(h('p.tip.center', '提示：当前浏览器不能保存进度，关掉页面后记录会清空。'));
    body.appendChild(h('p.home-foot', '语文岛 v' + Y.version + ' · 不联网，不收集任何数据'));
  });

  /* ---------- 家长门槛 ---------- */
  var GATES = [
    { q: '《题西林壁》的作者是谁？', a: '苏轼', o: ['苏轼', '白居易', '王昌龄', '李清照'] },
    { q: '《凉州词》的作者是谁？', a: '王翰', o: ['王翰', '王昌龄', '卢钺', '苏轼'] },
    { q: '《雪梅》是哪个朝代的诗？', a: '宋', o: ['宋', '唐', '汉', '秦'] }

  Y.router.add('/parent-gate', function () {

        return h('button.opt', { type: 'button', onclick: function (e) {

        } }, o);
      }))));
  });

  /* ---------- 建设中的页面 ---------- */
  function building(title, icon, text, back, theme, extra) {
    var body = Y.ui.page({ title: title, icon: icon, back: back, theme: theme, nav: back ? null : extra && extra.nav });
    body.appendChild(h('section.card.building',

  <script>/* js/app.js */
/* 启动：应用设置、休息提醒、开始路由。最后加载。 */
(function (Y) {
  'use strict';

  Y.applySettings = function () {
    var s = Y.settings.get();
    document.documentElement.setAttribute('data-font', s.fontSize === 'large' ? 'large' : 'normal');
  };
  Y.applySettings();

  // iOS 需要在第一次点按时解锁音频
  document.addEventListener('pointerdown', function once() {
    Y.sound.unlock();
    document.removeEventListener('pointerdown', once);
  });

  /* 连续使用 25 分钟，温和提醒休息（只在页面可见时计时） */
  var REST_MS = 25 * 60 * 1000;
  var used = 0, last = Date.now();
  setInterval(function () {
    var now = Date.now();
    if (document.visibilityState === 'visible') used += Math.min(now - last, 60000);
    last = now;
    if (used >= REST_MS && !document.querySelector('.modal-wrap')) {
      used = 0;
      Y.ui.modal({
        icon: '🍵', title: '已经学了 25 分钟啦',
        body: '站起来走一走，看看窗外远处的绿色，让眼睛休息一下吧。',
        buttons: [{ label: '好的，休息一下', cls: 'primary' }, { label: '再学一会儿' }]
      });
    }
  }, 15000);

  // 离线缓存：只在 http(s) 下注册（GitHub Pages）；本地双击打开或单文件版不注册
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.YUWEN_BUNDLE) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 不支持就算了 */ });
    });
  }

  Y.router.start();
})(window.YuwenIsland);

</script>
